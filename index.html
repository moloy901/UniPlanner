<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniPlanner — Sign in</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📚</span>
      <h1>UniPlanner</h1>
      <p>Plan your studies, ace your deadlines</p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="login" role="tab" aria-selected="true">
        Log in
      </button>
      <button type="button" class="tab" data-tab="signup" role="tab" aria-selected="false">
        Sign up
      </button>
    </div>

    <div id="auth-message" class="message" role="alert"></div>

    <form id="login-form" class="auth-form active" method="post">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          type="email"
          id="login-email"
          name="email"
          required
          autocomplete="email"
          placeholder="you@university.edu"
        >
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <form id="signup-form" class="auth-form" method="post">
      <div class="form-group">
        <label for="signup-name">Name</label>
        <input
          type="text"
          id="signup-name"
          name="name"
          required
          autocomplete="name"
          placeholder="Your name"
          maxlength="80"
        >
      </div>

      <div class="form-group">
        <label for="signup-email">Email</label>
        <input
          type="email"
          id="signup-email"
          name="email"
          required
          autocomplete="email"
          placeholder="you@university.edu"
        >
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          name="password"
          required
          autocomplete="new-password"
          placeholder="At least 6 characters"
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="signup-confirm">Confirm password</label>
        <input
          type="password"
          id="signup-confirm"
          name="confirm"
          required
          autocomplete="new-password"
          placeholder="••••••••"
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
