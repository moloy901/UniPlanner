<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniPlanner — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <div class="dashboard">
    <header class="header">
      <div class="brand">
        <h1>📚 UniPlanner</h1>
        <p>Your study tasks at a glance</p>
      </div>
      <div class="user-bar">
        <span id="user-email" class="user-email"></span>
        <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">Log out</button>
      </div>
    </header>

    <div id="dashboard-message" class="message" role="alert"></div>

    <section class="stats-grid" aria-label="Task summary">
      <div class="stat-card">
        <span class="stat-label">Total tasks</span>
        <strong id="stat-total">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Due today</span>
        <strong id="stat-today">0</strong>
      </div>
      <div class="stat-card stat-card-warning">
        <span class="stat-label">Overdue</span>
        <strong id="stat-overdue">0</strong>
      </div>
      <div class="stat-card stat-card-success">
        <span class="stat-label">Completed</span>
        <strong id="stat-completed">0</strong>
      </div>
    </section>

    <div class="dashboard-grid">
      <aside class="panel">
        <h2>Add a task</h2>

        <form id="task-form" class="task-form">
          <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" name="title" required placeholder="e.g. Chapter 5 homework" maxlength="200">
          </div>

          <div class="form-group">
            <label for="task-subject">Subject</label>
            <input type="text" id="task-subject" name="subject" required placeholder="e.g. Calculus" maxlength="100">
          </div>

          <div class="form-group">
            <label for="task-deadline">Deadline</label>
            <input type="date" id="task-deadline" name="deadline" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority" name="priority" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-status">Status</label>
              <select id="task-status" name="status" required>
                <option value="pending" selected>Pending</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="task-submit-btn" class="btn btn-primary">Add task</button>
            <button type="button" id="cancel-edit-btn" class="btn btn-secondary hidden">Cancel edit</button>
          </div>
        </form>
      </aside>

      <main class="panel">
        <div class="panel-heading">
          <h2>My tasks</h2>

          <div class="task-tools">
            <label class="sr-only" for="task-search">Search tasks</label>
            <input type="search" id="task-search" class="task-search" placeholder="Search title or subject">

            <label class="sr-only" for="task-sort">Sort tasks</label>
            <select id="task-sort" class="task-sort">
              <option value="deadline">Sort by deadline</option>
              <option value="priority">Sort by priority</option>
              <option value="created">Newest first</option>
            </select>
          </div>
        </div>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="today">Today</button>
          <button type="button" class="filter-btn" data-filter="overdue">Overdue</button>
          <button type="button" class="filter-btn" data-filter="pending">Pending</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
          <button type="button" class="filter-btn" data-filter="high">High priority</button>
        </div>

        <div id="task-loading" class="loading hidden">Loading tasks…</div>
        <div id="task-list" class="task-list" aria-live="polite"></div>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">📝</div>
          <p>No tasks here yet. Add one to get started!</p>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
